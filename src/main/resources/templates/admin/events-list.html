<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Manage Events</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f4f8; color: #333; }
        nav { background: #1a237e; color: white; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        nav a { color: white; text-decoration: none; margin-left: 1rem; }
        .container { max-width: 1200px; margin: 2rem auto; padding: 0 1rem; }
        h1 { color: #1a237e; margin-bottom: 1.5rem; }
        .filters { background: white; padding: 1.5rem; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.1); margin-bottom: 1.5rem; }
        .filters h3 { margin-bottom: 1rem; color: #555; font-size: 0.95rem; text-transform: uppercase; letter-spacing: 1px; }
        .filter-row { display: flex; flex-wrap: wrap; gap: 1rem; align-items: flex-end; }
        .filter-group { display: flex; flex-direction: column; gap: 0.3rem; }
        .filter-group label { font-size: 0.85rem; font-weight: 600; color: #555; }
        .filter-group input, .filter-group select { padding: 0.5rem 0.75rem; border: 1px solid #ccc; border-radius: 4px; font-size: 0.9rem; }
        .btn { display: inline-block; padding: 0.5rem 1rem; border-radius: 4px; text-decoration: none; font-weight: bold; font-size: 0.9rem; cursor: pointer; border: none; }
        .btn-primary { background: #ff6f00; color: white; }
        .btn-primary:hover { background: #e65100; }
        .btn-blue { background: #1a237e; color: white; }
        .btn-blue:hover { background: #283593; }
        .btn-green { background: #2e7d32; color: white; font-size: .8rem; }
        .btn-edit { background: #1565c0; color: white; font-size: .8rem; }
        .btn-del { background: #c62828; color: white; font-size: .8rem; }
        .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,.1); }
        th { background: #1a237e; color: white; padding: 0.75rem 1rem; text-align: left; font-size: 0.9rem; }
        td { padding: 0.7rem 1rem; border-bottom: 1px solid #e0e0e0; font-size: 0.9rem; }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: #f5f5f5; }
        .badge { padding: 0.2rem 0.6rem; border-radius: 20px; font-size: 0.75rem; background: #e3f2fd; color: #1565c0; }
        .alert-success { background: #e8f5e9; border: 1px solid #a5d6a7; padding: 0.75rem; border-radius: 4px; margin-bottom: 1rem; color: #2e7d32; }
    </style>
</head>
<body>
<nav>
    <strong>🎓 CampusEvents Admin</strong>
    <div>
        <a th:href="@{/admin/dashboard}">Dashboard</a>
        <a th:href="@{/admin/events}">Manage Events</a>
        <a th:href="@{/logout}">Logout</a>
    </div>
</nav>

<div class="container">
    <h1>🗂 Manage Events</h1>

    <div th:if="${success}" class="alert-success" th:text="${success}"></div>

    <!-- Search & Filter -->
    <div class="filters">
        <h3>🔍 Search & Filter</h3>
        <form th:action="@{/admin/events}" method="get">
            <div class="filter-row">
                <div class="filter-group">
                    <label>Keyword</label>
                    <input type="text" name="keyword" th:value="${keyword}" placeholder="Event title..."/>
                </div>
                <div class="filter-group">
                    <label>Department</label>
                    <select name="dept">
                        <option value="">All</option>
                        <option value="CSE" th:selected="${dept == 'CSE'}">CSE</option>
                        <option value="ECE" th:selected="${dept == 'ECE'}">ECE</option>
                        <option value="MECH" th:selected="${dept == 'MECH'}">MECH</option>
                        <option value="CIVIL" th:selected="${dept == 'CIVIL'}">CIVIL</option>
                        <option value="MBA" th:selected="${dept == 'MBA'}">MBA</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Event Type</label>
                    <select name="type">
                        <option value="">All</option>
                        <option value="Workshop" th:selected="${type == 'Workshop'}">Workshop</option>
                        <option value="Seminar" th:selected="${type == 'Seminar'}">Seminar</option>
                        <option value="Cultural" th:selected="${type == 'Cultural'}">Cultural</option>
                        <option value="Technical" th:selected="${type == 'Technical'}">Technical</option>
                        <option value="Sports" th:selected="${type == 'Sports'}">Sports</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>From Date</label>
                    <input type="date" name="fromDate" th:value="${fromDate}"/>
                </div>
                <div class="filter-group">
                    <label>To Date</label>
                    <input type="date" name="toDate" th:value="${toDate}"/>
                </div>
                <button type="submit" class="btn btn-blue">Apply Filters</button>
                <a th:href="@{/admin/events}" class="btn" style="background:#607d8b;color:white;">Reset</a>
            </div>
        </form>
    </div>

    <!-- Events Table -->
    <div class="header-row">
        <span style="color:#555;">Showing <strong th:text="${#lists.size(events)}">0</strong> event(s)</span>
        <a th:href="@{/admin/events/add}" class="btn btn-primary">+ Add New Event</a>
    </div>

    <table>
        <thead>
        <tr>
            <th>#</th>
            <th>Title</th>
            <th>Date</th>
            <th>Type</th>
            <th>Department</th>
            <th>Venue</th>
            <th>Seats</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="event, stat : ${events}">
            <td th:text="${stat.count}"></td>
            <td th:text="${event.title}"></td>
            <td th:text="${event.eventDate}"></td>
            <td><span class="badge" th:text="${event.eventType}"></span></td>
            <td th:text="${event.department}"></td>
            <td th:text="${event.venue}"></td>
            <td th:text="${event.registeredCount + '/' + event.capacity}"></td>
            <td style="white-space:nowrap; display:flex; gap:4px;">
                <a th:href="@{/admin/events/edit/{id}(id=${event.id})}" class="btn btn-edit">Edit</a>
                <a th:href="@{/admin/events/{id}/registrations(id=${event.id})}" class="btn btn-green">Regs</a>
                <form th:action="@{/admin/events/delete/{id}(id=${event.id})}" method="post"
                      onsubmit="return confirm('Delete this event?')">
                    <button type="submit" class="btn btn-del">Delete</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(events)}">
            <td colspan="8" style="text-align:center;color:#999;padding:2rem;">No events found.</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
