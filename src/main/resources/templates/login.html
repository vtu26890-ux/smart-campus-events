<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Login</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background: #1a237e; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .card { background: white; padding: 2.5rem; border-radius: 12px; width: 360px; box-shadow: 0 8px 32px rgba(0,0,0,.3); }
        h1 { color: #1a237e; margin-bottom: 0.5rem; font-size: 1.6rem; }
        p { color: #666; margin-bottom: 2rem; font-size: 0.9rem; }
        .form-group { margin-bottom: 1.2rem; }
        label { display: block; font-weight: 600; margin-bottom: 0.3rem; color: #444; }
        input { width: 100%; padding: 0.6rem 0.8rem; border: 1px solid #ccc; border-radius: 4px; font-size: 1rem; }
        input:focus { outline: none; border-color: #1a237e; }
        .btn { width: 100%; padding: 0.75rem; background: #1a237e; color: white; border: none; border-radius: 4px; font-size: 1rem; font-weight: bold; cursor: pointer; margin-top: 0.5rem; }
        .btn:hover { background: #283593; }
        .error { background: #ffebee; color: #c62828; padding: 0.75rem; border-radius: 4px; margin-bottom: 1rem; font-size: 0.85rem; }
        .hint { margin-top: 1rem; font-size: 0.8rem; color: #888; text-align: center; }
    </style>
</head>
<body>
<div class="card">
    <h1>🔐 Admin Login</h1>
    <p>Smart Campus Event Management</p>

    <div class="error" th:if="${param.error}">
        Invalid username or password.
    </div>
    <div th:if="${param.logout}" style="background:#e8f5e9;color:#2e7d32;padding:.75rem;border-radius:4px;margin-bottom:1rem;font-size:.85rem;">
        Logged out successfully.
    </div>

    <form th:action="@{/login}" method="post">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="admin"/>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="••••••••"/>
        </div>
        <button type="submit" class="btn">Login</button>
    </form>
    <div class="hint">Default: admin / admin123</div>
</div>
</body>
</html>
