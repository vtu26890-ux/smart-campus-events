<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Error</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f4f8; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .card { background: white; padding: 3rem; border-radius: 12px; text-align: center; max-width: 500px; box-shadow: 0 4px 24px rgba(0,0,0,.12); }
        .icon { font-size: 4rem; margin-bottom: 1rem; }
        h1 { color: #c62828; margin-bottom: 1rem; }
        p { color: #666; margin-bottom: 2rem; }
        a { display: inline-block; padding: 0.75rem 1.5rem; background: #1a237e; color: white; border-radius: 4px; text-decoration: none; font-weight: bold; }
        a:hover { background: #283593; }
    </style>
</head>
<body>
<div class="card">
    <div class="icon">⚠️</div>
    <h1>Something went wrong</h1>
    <p th:text="${errorMessage}">An unexpected error occurred.</p>
    <a href="/">← Go Home</a>
</div>
</body>
</html>
