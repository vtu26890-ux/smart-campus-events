<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Browse Events</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f4f8; color: #333; }
        nav { background: #1a237e; color: white; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        nav a { color: white; text-decoration: none; margin-left: 1rem; font-size: 0.9rem; }
        nav a:hover { text-decoration: underline; }
        .nav-left { font-weight: bold; font-size: 1.1rem; }
        .nav-right { display: flex; align-items: center; gap: 0.5rem; }
        .user-info { color: #90caf9; font-size: 0.85rem; margin-right: 0.5rem; }
        .logout-btn { background: #ef5350; color: white; border: none; padding: 0.4rem 0.9rem;
                      border-radius: 4px; cursor: pointer; font-size: 0.85rem; font-weight: bold; }
        .logout-btn:hover { background: #c62828; }
        .login-btn { background: #ff6f00; color: white; padding: 0.4rem 0.9rem;
                     border-radius: 4px; font-size: 0.85rem; font-weight: bold; text-decoration: none; }
        .container { max-width: 1100px; margin: 2rem auto; padding: 0 1rem; }
        h1 { color: #1a237e; margin-bottom: 1.5rem; }
        .alert-success { background: #e8f5e9; border: 1px solid #a5d6a7; padding: 0.75rem 1rem; border-radius: 4px; margin-bottom: 1rem; color: #2e7d32; }
        .alert-error { background: #ffebee; border: 1px solid #ef9a9a; padding: 0.75rem 1rem; border-radius: 4px; margin-bottom: 1rem; color: #c62828; }
        .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem; }
        .card { background: white; border-radius: 8px; padding: 1.5rem; box-shadow: 0 2px 8px rgba(0,0,0,.1); }
        .card h3 { color: #1a237e; margin-bottom: 0.5rem; }
        .badge { display: inline-block; padding: 0.2rem 0.6rem; border-radius: 20px; font-size: 0.75rem; background: #e3f2fd; color: #1565c0; margin-bottom: 0.5rem; margin-right: 4px; }
        .badge-dept { background: #fce4ec; color: #880e4f; }
        .card-meta { font-size: 0.85rem; color: #666; margin-top: 0.5rem; }
        .btn { display: inline-block; padding: 0.5rem 1rem; border-radius: 4px; text-decoration: none; font-weight: bold; font-size: 0.85rem; }
        .btn-primary { background: #ff6f00; color: white; margin-top: 1rem; }
        .btn-primary:hover { background: #e65100; }
        .btn-login { background: #1a73e8; color: white; margin-top: 1rem; }
        .full { background: #bdbdbd; color: white; cursor: not-allowed; margin-top: 1rem; display: inline-block; padding: 0.5rem 1rem; border-radius: 4px; font-size: 0.85rem; }
        .seats { font-size: 0.8rem; color: #555; margin-top: 0.5rem; }
    </style>
</head>
<body>
<nav>
    <a th:href="@{/}" class="nav-left" style="color:white;text-decoration:none;">🎓 CampusEvents</a>
    <div class="nav-right">
        <a th:href="@{/events}">Browse Events</a>
        <a th:href="@{/my-registrations}">My Registrations</a>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/dashboard}">Admin</a>

        <!-- Show when logged in -->
        <span sec:authorize="isAuthenticated()">
            <span class="user-info" sec:authentication="name">User</span>
            <form th:action="@{/logout}" method="post" style="display:inline;">
                <button type="submit" class="logout-btn">Logout</button>
            </form>
        </span>

        <!-- Show when not logged in -->
        <a sec:authorize="!isAuthenticated()" th:href="@{/login}" class="login-btn">Login</a>
    </div>
</nav>

<div class="container">
    <h1>📅 Upcoming Events</h1>

    <div th:if="${success}" class="alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert-error" th:text="${error}"></div>

    <div class="cards">
        <div class="card" th:each="event : ${events}">
            <span class="badge" th:text="${event.eventType}">Type</span>
            <span class="badge badge-dept" th:text="${event.department}">Dept</span>
            <h3 th:text="${event.title}">Title</h3>
            <p th:text="${event.description != null ? #strings.abbreviate(event.description, 100) : ''}"></p>
            <div class="card-meta">
                📅 <span th:text="${event.eventDate}">Date</span>
                <span th:if="${event.eventTime}"> at <span th:text="${event.eventTime}"></span></span><br/>
                📍 <span th:text="${event.venue}">Venue</span><br/>
                👤 <span th:text="${event.organizer}">Organizer</span>
            </div>
            <div class="seats">
                Seats: <span th:text="${event.registeredCount}">0</span> / <span th:text="${event.capacity}">0</span>
            </div>

            <!-- Logged in → show register button -->
            <a sec:authorize="isAuthenticated()"
               th:if="${event.registeredCount < event.capacity}"
               th:href="@{/register/{id}(id=${event.id})}" class="btn btn-primary">Register</a>

            <!-- Not logged in → prompt to login first -->
            <a sec:authorize="!isAuthenticated()"
               th:if="${event.registeredCount < event.capacity}"
               th:href="@{/login}" class="btn btn-login">Login to Register</a>

            <span th:if="${event.registeredCount >= event.capacity}" class="full">Fully Booked</span>
        </div>
    </div>
    <div th:if="${#lists.isEmpty(events)}" style="margin-top:2rem;color:#666;">
        No upcoming events found.
    </div>
</div>
</body>
</html>
