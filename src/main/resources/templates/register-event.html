<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register for Event</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f4f8; color: #333; }
        nav { background: #1a237e; color: white; padding: 1rem 2rem; display: flex; justify-content: space-between; }
        nav a { color: white; text-decoration: none; margin-left: 1rem; }
        .container { max-width: 600px; margin: 2rem auto; background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,.1); }
        h1 { color: #1a237e; margin-bottom: 0.5rem; }
        .event-info { background: #e3f2fd; padding: 1rem; border-radius: 4px; margin-bottom: 1.5rem; }
        .form-group { margin-bottom: 1.2rem; }
        label { display: block; font-weight: 600; margin-bottom: 0.3rem; }
        input, select { width: 100%; padding: 0.6rem 0.8rem; border: 1px solid #ccc; border-radius: 4px; font-size: 1rem; }
        input:focus, select:focus { outline: none; border-color: #1a237e; }
        .error { color: #c62828; font-size: 0.82rem; margin-top: 0.2rem; }
        .btn { padding: 0.75rem 1.5rem; background: #ff6f00; color: white; border: none; border-radius: 4px; font-size: 1rem; font-weight: bold; cursor: pointer; }
        .btn:hover { background: #e65100; }
        .btn-back { background: #607d8b; margin-left: 1rem; }
    </style>
</head>
<body>
<nav>
    <a th:href="@{/}" style="color:white;text-decoration:none;font-weight:bold">🎓 CampusEvents</a>
    <div>
        <a th:href="@{/events}">Browse Events</a>
        <a th:href="@{/my-registrations}">My Registrations</a>
    </div>
</nav>

<div class="container">
    <h1>Register for Event</h1>
    <div class="event-info">
        <strong th:text="${event.title}">Event Title</strong><br/>
        📅 <span th:text="${event.eventDate}">Date</span> &nbsp; 📍 <span th:text="${event.venue}">Venue</span>
    </div>

    <form th:action="@{/register/{id}(id=${event.id})}" th:object="${registration}" method="post">
        <div class="form-group">
            <label for="studentName">Full Name *</label>
            <input type="text" id="studentName" th:field="*{studentName}" placeholder="Enter your full name"/>
            <div class="error" th:if="${#fields.hasErrors('studentName')}" th:errors="*{studentName}"></div>
        </div>
        <div class="form-group">
            <label for="email">Email *</label>
            <input type="email" id="email" th:field="*{email}" placeholder="student@college.edu"/>
            <div class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
        </div>
        <div class="form-group">
            <label for="rollNumber">Roll Number *</label>
            <input type="text" id="rollNumber" th:field="*{rollNumber}" placeholder="e.g. 21CS001"/>
            <div class="error" th:if="${#fields.hasErrors('rollNumber')}" th:errors="*{rollNumber}"></div>
        </div>
        <div class="form-group">
            <label for="department">Department *</label>
            <select id="department" th:field="*{department}">
                <option value="">-- Select --</option>
                <option value="CSE">Computer Science (CSE)</option>
                <option value="ECE">Electronics (ECE)</option>
                <option value="MECH">Mechanical (MECH)</option>
                <option value="CIVIL">Civil (CIVIL)</option>
                <option value="MBA">MBA</option>
                <option value="Other">Other</option>
            </select>
            <div class="error" th:if="${#fields.hasErrors('department')}" th:errors="*{department}"></div>
        </div>
        <button type="submit" class="btn">✅ Register</button>
        <a th:href="@{/events}" class="btn btn-back" style="text-decoration:none;display:inline-block;padding:.75rem 1.5rem;">← Back</a>
    </form>
</div>
</body>
</html>
