# ── Server ────────────────────────────────────────────────────────────────────
server.port=${PORT:8080}

# ── Database ──────────────────────────────────────────────────────────────────
# Uses PostgreSQL on Railway (DATABASE_URL set automatically)
# Falls back to H2 for local development
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:campusdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASS:}

# Auto-detect driver from URL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# H2 console (local dev only - disabled in prod)
spring.h2.console.enabled=${SHOW_H2_CONSOLE:false}
spring.h2.console.path=/h2-console

# ── Thymeleaf ─────────────────────────────────────────────────────────────────
spring.thymeleaf.cache=true

# ── App ───────────────────────────────────────────────────────────────────────
spring.application.name=Smart Campus Events
app.name=Smart Campus Events

# ── Email (Resend API) ────────────────────────────────────────────────────────
resend.api.key=${RESEND_API_KEY:}
resend.from.email=${RESEND_FROM_EMAIL:onboarding@resend.dev}