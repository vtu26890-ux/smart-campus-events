# ── Server ────────────────────────────────────────────────────────────────────
server.port=${PORT:8080}

# ── Database ──────────────────────────────────────────────────────────────────
# DATABASE_URL is injected by Railway as postgresql://user:pass@host/db
# DatabaseConfig.java converts it to jdbc:postgresql:// at runtime
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=${SHOW_H2_CONSOLE:false}

# ── Thymeleaf ─────────────────────────────────────────────────────────────────
spring.thymeleaf.cache=false

# ── App ───────────────────────────────────────────────────────────────────────
spring.application.name=Smart Campus Events
app.name=Smart Campus Events

# ── Email (Resend API) ────────────────────────────────────────────────────────
resend.api.key=${RESEND_API_KEY:}
resend.from.email=${RESEND_FROM_EMAIL:onboarding@resend.dev}

# ── Google OAuth2 ─────────────────────────────────────────────────────────────
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile
